name: Helikon-mini RC2 validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: helikon-mini-rc2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source candidate and ephemeral packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify repository source checksums
        run: sha256sum -c checksums/Helikon-mini_3.3.0_RC2_REPOSITORY_SHA256SUMS.txt

      - name: Build and compare deterministic RC2 archives
        run: |
          python3 validators/build_deterministic_zip.py \
            --release-dir release/v3.3.0 \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate.zip"
          python3 validators/build_deterministic_zip.py \
            --release-dir release/v3.3.0 \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate_rebuild.zip"
          cmp \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate.zip" \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate_rebuild.zip"

      - name: Validate RC2 release family and archive
        run: |
          python3 validators/validate_release.py \
            --release-dir release/v3.3.0 \
            --zip "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate.zip" \
            --source-dir source-rc1/v3.3.0 \
            --provenance governance/RC1_SOURCE_PROVENANCE.json

      - name: Validate the live-host evidence template
        run: |
          python3 live-host-qa/tools/validate_live_host_evidence.py \
            --evidence live-host-qa/LIVE_HOST_QA_EVIDENCE_TEMPLATE.json \
            --source-lock live-host-qa/SOURCE_LOCK.json \
            --allow-not-run

      - name: Build, compare, and validate ephemeral live-host QA kits
        run: |
          python3 live-host-qa/tools/build_qa_kit.py \
            --kit-root live-host-qa \
            --rc2-archive "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate.zip" \
            --v32-package Helikon-mini_Install_Package_v3.2.0.json \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_LIVE_HOST_QA_OPERATOR_KIT.zip"
          python3 live-host-qa/tools/build_qa_kit.py \
            --kit-root live-host-qa \
            --rc2-archive "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_draft_candidate.zip" \
            --v32-package Helikon-mini_Install_Package_v3.2.0.json \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_LIVE_HOST_QA_OPERATOR_KIT_rebuild.zip"
          cmp \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_LIVE_HOST_QA_OPERATOR_KIT.zip" \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_LIVE_HOST_QA_OPERATOR_KIT_rebuild.zip"
          mkdir "$RUNNER_TEMP/live-host-qa-kit"
          unzip -q \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_RC2_LIVE_HOST_QA_OPERATOR_KIT.zip" \
            -d "$RUNNER_TEMP/live-host-qa-kit"
          python3 live-host-qa/tools/validate_qa_kit.py \
            --root "$RUNNER_TEMP/live-host-qa-kit"
