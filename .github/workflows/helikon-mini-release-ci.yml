name: Helikon-mini release validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: helikon-mini-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate final source and deterministic package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify repository source checksums
        run: sha256sum -c checksums/Helikon-mini_3.3.0_REPOSITORY_SHA256SUMS.txt

      - name: Build and compare deterministic release archives
        run: |
          python3 validators/build_deterministic_zip.py \
            --release-dir release/v3.3.0 \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0.zip"
          python3 validators/build_deterministic_zip.py \
            --release-dir release/v3.3.0 \
            --output "$RUNNER_TEMP/Helikon-mini_3.3.0_rebuild.zip"
          cmp \
            "$RUNNER_TEMP/Helikon-mini_3.3.0.zip" \
            "$RUNNER_TEMP/Helikon-mini_3.3.0_rebuild.zip"

      - name: Validate release family and archive
        run: |
          python3 validators/validate_release.py \
            --release-dir release/v3.3.0 \
            --zip "$RUNNER_TEMP/Helikon-mini_3.3.0.zip" \
            --source-dir source-rc1/v3.3.0 \
            --provenance governance/RC1_SOURCE_PROVENANCE.json
